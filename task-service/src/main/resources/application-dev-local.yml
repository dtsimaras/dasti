spring:
  devtools:
    restart:
      enabled: false

  config:
    activate:
      on-profile: dev-local

  datasource:
    url: jdbc:h2:mem:tasks
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false

    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
    path: /api-docs

  swagger-ui:
    enabled: true
    path: /swagger

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  tracing:
    enabled: false

logging:
  level:
    root: INFO
    com.dasti.tasks: DEBUG

#  structured:
#    format:
#      console: logstash