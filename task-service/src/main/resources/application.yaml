spring:
  application:
    name: tasks

  profiles:
    default: dev-local

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

  shutdown: graceful

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO